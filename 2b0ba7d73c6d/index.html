// >>> auth-core — проверка персонального ключа из ссылки.

// хранилища браузера.
const AUTH_STORE = 'pnstroy-key';

async function authSha256Hex(text) {
  const bytes = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest('SHA-256', bytes);
  return Array.from(new Uint8Array(digest))
    .map(b => b.toString(16).padStart(2, '0')).join('');
}

function authKeyFromHash(hash) {
  const m = /(?:^|[#&?])k=([^&]+)/.exec(String(hash || ''));
  if (!m) return '';
  try { return decodeURIComponent(m[1]).trim(); } catch (e) { return m[1].trim(); }
}

function authRememberedKey() {
  try { return (localStorage.getItem(AUTH_STORE) || '').trim(); } catch (e) { return ''; }
}

function authRemember(key) {
  try { localStorage.setItem(AUTH_STORE, key); } catch (e) { /* приватный режим */ }
}

// → запись реестра {person_id, name, role, objects, key} либо null.
// null во всех случаях: ключа нет, ключ неизвестен, ключ отозван (отозванных
// в таблице просто нет), браузер без WebCrypto.
async function authResolve(entries) {
  const key = authKeyFromHash(location.hash) || authRememberedKey();
  if (!key) return null;
  if (!(typeof crypto !== 'undefined' && crypto.subtle)) return null;
  let digest;
  try { digest = await authSha256Hex(key); } catch (e) { return null; }
  const found = (entries || []).filter(e => e && e.h === digest)[0];
  if (!found) return null;
  authRemember(key);
  return {key: key, person_id: found.p, name: found.n || '',
          role: found.r || '', objects: found.o || []};
}

const SEC_INFO = 'pnstroy-section-v1';

function secBytesFromB64(b64) {
  const bin = atob(String(b64 || ''));
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function secSha256Hex(text) {
  const bytes = new TextEncoder().encode(String(text || ''));
  const digest = await crypto.subtle.digest('SHA-256', bytes);
  return Array.from(new Uint8Array(digest))
    .map(b => b.toString(16).padStart(2, '0')).join('');

// Персональный ключ + соль раздела → ключ, которым завёрнут ключ раздела.

// и та же ссылка на двух разных сайтах разворачивает разные обёртки.
async function secDeriveKey(personalKey, salt) {
  const enc = new TextEncoder();
  const ikm = await crypto.subtle.importKey(
    'raw', enc.encode(String(personalKey || '')), 'HKDF', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name: 'HKDF', hash: 'SHA-256', salt: enc.encode(String(salt || '')),
     info: enc.encode(SEC_INFO)},
    ikm, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
}

async function secAesDecrypt(key, iv, ct) {
  const plain = await crypto.subtle.decrypt(
    {name: 'AES-GCM', iv: secBytesFromB64(iv)}, key, secBytesFromB64(ct));
  return new TextDecoder().decode(new Uint8Array(plain));
}

  if (!(typeof crypto !== 'undefined' && crypto.subtle)) return null;
  let digest;
  try { digest = await secSha256Hex(personalKey); } catch (e) { return null; }
  const mine = (section.wraps || []).filter(w => w && w.h === digest)[0];
  if (!mine) return null;
  try {
    const wrapKey = await secDeriveKey(personalKey, section.salt);
    const rawKey = await crypto.subtle.decrypt(
      {name: 'AES-GCM', iv: secBytesFromB64(mine.iv)}, wrapKey,
      secBytesFromB64(mine.ct));
    const dataKey = await crypto.subtle.importKey(
      'raw', new Uint8Array(rawKey), {name: 'AES-GCM'}, false, ['decrypt']);
    const data = section.data || {};
    return JSON.parse(await secAesDecrypt(dataKey, data.iv, data.ct));
  } catch (e) {
    return null;
  }
}
// <<< section-core

// >>> gh-submit-core — чистая часть отправки в GitHub.
// Блок выдёргивается из готового html и прогоняется в node тестом
// tests/test_github_submit.py; ничего, кроме своих аргументов, не трогает.

// Куски из констант GH_TA…GH_TD → токен. base64 от перевёрнутой строки: целой
// строки токена в исходнике страницы нет, иначе GitHub отозвал бы его, как
// только страница попала в публичный репозиторий сайта.
function ghAssembleToken(parts) {
  const blob = parts.join('');
  if (!blob) return '';
  const bin = atob(blob);
  let out = '';
  for (let i = bin.length - 1; i >= 0; i--) out += bin.charAt(i);
  return out;
}

function ghStamp(d) {
  const p = n => String(n).padStart(2, '0');
  return '' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) +
         '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
}

function ghReportPath(objectCode, week, stamp) {
  return 'reports/' + objectCode + '/' + week + '-' + stamp + '.json';
}

function ghBase64(text) {
  // GitHub Contents API принимает содержимое только base64 от utf-8 байтов.
  const bytes = new TextEncoder().encode(text);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(bin);
}

// `content` — то, что ляжет в репозиторий файлом. Со включённым шифрованием это
// конверт (ghEncryptEnvelope ниже), а не сам отчёт.
// Путь и сообщение коммита берутся из cfg: этим же блоком уходят и отчёты
// начальника участка (reports/<код>/<неделя>-<метка>.json), и пачки изменений
// плана из редактора (plan/<код>/<метка>.json). Значения по умолчанию —
// отчётные, чтобы форма отчёта ничего про это не знала.
function ghBuildRequest(cfg, content, stamp) {
  const prefix = cfg.pathPrefix || 'reports';
  const slug = cfg.slug || ((cfg.week ? cfg.week + '-' : '') + stamp);
  const path = prefix + '/' + cfg.objectCode + '/' + slug + '.json';
  const message = cfg.message || ('report ' + cfg.objectCode + ' ' + cfg.week);
  return {
    path: path,
    url: 'https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo + '/contents/' + path,
    init: {
      method: 'PUT',
      headers: {
        'Accept': 'application/vnd.github+json',
        'Authorization': 'Bearer ' + cfg.token,
        'X-GitHub-Api-Version': '2022-11-28',
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        message: message,
        content: ghBase64(JSON.stringify(content, null, 2)),
        branch: cfg.branch,
      }),
    },
  };
}
// <<< gh-submit-core

// >>> gh-crypto-core — шифрование отчёта перед отправкой.
// Блок так же выдёргивается из готового html и прогоняется в node тестом
// tests/test_report_crypto.py: то, что здесь запечатано, распечатывается
// на мини модулем tools/weekly/reports_crypto.py — иначе схема неверна.
//
// Гибрид: случайный AES-GCM-256 ключ шифрует отчёт, открытый RSA-3072 ключ
// шифрует этот AES-ключ. Наружу (в приватный, но читаемый токеном репозиторий)
// уходит только конверт; из содержимого отчёта в нём нет ничего.
function ghCryptoAvailable() {
  return typeof crypto !== 'undefined' && !!crypto.subtle &&
         typeof crypto.subtle.encrypt === 'function';
}

// Тот же приём, что в ghBase64: по кускам, иначе длинный отчёт уронит стек.
function ghB64Bytes(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(bin);
}

function ghBytesFromB64(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function ghEncryptEnvelope(pubKeyB64, keyId, payload, meta) {
  const pub = await crypto.subtle.importKey(
    'spki', ghBytesFromB64(pubKeyB64),
    {name: 'RSA-OAEP', hash: 'SHA-256'}, false, ['encrypt']);

  const aesKey = await crypto.subtle.generateKey(
    {name: 'AES-GCM', length: 256}, true, ['encrypt']);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const plain = new TextEncoder().encode(JSON.stringify(payload));

  const ct = new Uint8Array(
    await crypto.subtle.encrypt({name: 'AES-GCM', iv: iv}, aesKey, plain));
  const rawKey = new Uint8Array(await crypto.subtle.exportKey('raw', aesKey));
  const ek = new Uint8Array(
    await crypto.subtle.encrypt({name: 'RSA-OAEP'}, pub, rawKey));

  // Метаданные — только служебные: по ним мини раскладывает файлы, и по ним
  // же видно в логе, что пришло. Ни одного поля отчёта здесь нет.
  //
  // Переносятся все ключи meta, а не три заранее известных: у отчёта это код
  // объекта, неделя и отметка времени, у пачки изменений плана недели нет, зато
  // есть kind. Единственное переименование — objectCode → object_code, потому
  // что снаружи конверт читает python.
  const envelope = {
    v: 1,
    alg: 'RSA-OAEP-256+A256GCM',
    kid: keyId,
    ek: ghB64Bytes(ek),
    iv: ghB64Bytes(iv),
    ct: ghB64Bytes(ct),
  };
  Object.keys(meta || {}).forEach(key => {
    const name = key === 'objectCode' ? 'object_code' : key;
    if (meta[key] !== undefined) envelope[name] = meta[key];
  });
  return envelope;
}
// <<< gh-crypto-core

// >>> people-core — раздел «Сотрудники»: список, выдача и отзыв доступа.
// Ключ новому сотруднику генерирует браузер — тем же алфавитом и той же длины,
// что people.py на мини: ссылку надо показать сразу, а мини заведёт запись
// через 5–10 минут, на следующем шаге забора.
const PP_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const PP_KEY_LENGTH = 26;

let PP_DATA = null;      // расшифрованное содержимое раздела
let PP_PENDING = [];     // заведённые в этом сеансе — мини их ещё не видел

function ppEsc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Случайный ключ без перекоса: значения байта, не делящиеся на длину алфавита
// нацело, выбрасываются. Иначе первые символы алфавита выпадали бы чаще —
// мелочь, но ключ здесь и есть весь доступ.
function ppNewKey() {
  const n = PP_ALPHABET.length;
  const limit = 256 - (256 % n);
  let out = '';
  while (out.length < PP_KEY_LENGTH) {
    const buf = crypto.getRandomValues(new Uint8Array(PP_KEY_LENGTH));
    for (let i = 0; i < buf.length && out.length < PP_KEY_LENGTH; i++) {
      if (buf[i] < limit) out += PP_ALPHABET.charAt(buf[i] % n);
    }
  }
  return out;
}

function ppLink(key) {
  return PP_SITE_BASE + '#k=' + encodeURIComponent(key);
}

function ppRoleLabel(role) { return authRoleLabel(role); }

function ppObjects(p) {
  if (p.role === 'director' || p.role === 'office' || p.role === 'pto') return 'все объекты';
  return (p.objects || []).join(', ') || '—';
}

function ppRuDate(iso) {
  const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? (m[3] + '.' + m[2] + '.' + m[1]) : '—';
}

function ppRows() {
  const rows = ((PP_DATA && PP_DATA.people) || []).slice();
  // Заведённые только что — вверху и с пометкой: в реестре мини их ещё нет,
  // и после публикации они придут оттуда уже обычными строками.
  PP_PENDING.forEach(p => {
    if (!rows.some(r => r.key === p.key)) rows.push(p);
  });
  const live = rows.filter(p => !p.revoked_at);
  const gone = rows.filter(p => p.revoked_at);
  return document.getElementById('ppShowRevoked').checked ? live.concat(gone) : live;
}

function ppRender() {
  const body = document.getElementById('ppBody');
  body.innerHTML = ppRows().map(p => {
    const revoked = !!p.revoked_at;
    const link = p.key ? ppLink(p.key) : '';
    const cell = revoked
      ? '<span class="pp-link">ссылка не работает</span>'
      : '<span class="pp-link" data-link="' + ppEsc(link) + '">' +
        '••••••••••••</span>' +
        '<button type="button" class="pp-act" data-act="show">Показать</button>' +
        '<button type="button" class="pp-act" data-act="copy">Скопировать</button>';
    const acts = revoked ? '' :
      ((p.role === 'site_head'
        ? '<button type="button" class="pp-act" data-act="objects">Изменить объекты</button>'
        : '') +
       (p.person_id
        ? '<button type="button" class="pp-act danger" data-act="revoke">Отозвать доступ</button>'
        : '<span class="pp-link">заводится…</span>'));
    return '<tr class="' + (revoked ? 'pp-revoked' : '') + '" data-id="' +
      ppEsc(p.person_id || '') + '" data-key="' + ppEsc(p.key || '') + '">' +
      '<td>' + ppEsc(p.name) + '</td>' +
      '<td>' + ppEsc(p.position || '—') + '</td>' +
      '<td>' + ppEsc(ppRoleLabel(p.role)) + '</td>' +
      '<td>' + ppEsc(ppObjects(p)) + '</td>' +
      '<td>' + ppEsc(ppRuDate(p.issued_at)) + '</td>' +
      '<td>' + (revoked ? 'отозван ' + ppEsc(ppRuDate(p.revoked_at)) : 'действует') + '</td>' +
      '<td>' + cell + '</td><td>' + acts + '</td></tr>';
  }).join('');

  const log = document.getElementById('ppLog');
  const events = ((PP_DATA && PP_DATA.log) || []).slice().reverse();
  log.innerHTML = events.length
    ? events.map(e => '<li>' + ppEsc(ppRuDate(e.at)) + ' — ' +
        ppEsc(e.action_label || e.action) + ': ' + ppEsc(e.person_name) +
        ' (' + ppEsc(e.role_label || e.role) + ')' +
        (e.by_name ? ', выдал ' + ppEsc(e.by_name) : '') + '</li>').join('')
    : '<li>Пока записей нет.</li>';
}

function ppCopy(text, btn) {
  const done = () => { const t = btn.textContent; btn.textContent = 'Скопировано';
    setTimeout(() => { btn.textContent = t; }, 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => ppCopyFallback(text, done));
  } else {
    ppCopyFallback(text, done);
  }
}

// Запасной путь: Safari отдаёт буфер обмена не всегда, а ссылку надо передать
// здесь и сейчас.
function ppCopyFallback(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { /* покажем как есть */ }
  document.body.removeChild(ta);
}

// ── Отправка запроса на мини ────────────────────────────────────────────────
// Тот же конверт, что у отчётов и правок плана: ключ нового сотрудника лежит
// внутри шифртекста, снаружи — только вид запроса и время.
async function ppSend(payload) {
  const token = ghAssembleToken(GH_TOKEN_PARTS);
  if (!GH_OWNER || !GH_REPO || !token || !PUB_KEY_B64) {
    return 'страница собрана без настроек отправки.';
  }
  if (!ghCryptoAvailable()) return 'браузер не умеет шифровать.';
  let envelope;
  try {
    envelope = await ghEncryptEnvelope(PUB_KEY_B64, KEY_ID, payload,
      {kind: payload.kind, ts: new Date().toISOString()});
  } catch (e) {
    return 'не удалось зашифровать запрос' + (e && e.message ? ' (' + e.message + ')' : '') + '.';
  }
  const cfg = {owner: GH_OWNER, repo: GH_REPO, branch: GH_BRANCH, token: token,
               objectCode: 'requests', pathPrefix: 'people',
               message: 'people ' + payload.kind};
  for (let attempt = 0; attempt < 3; attempt++) {
    const stamp = ghStamp(new Date()) + (attempt ? '-' + (attempt + 1) : '');
    const req = ghBuildRequest(Object.assign({slug: stamp}, cfg), envelope, stamp);
    let resp;
    try { resp = await fetch(req.url, req.init); }
    catch (e) { return 'нет соединения с GitHub.'; }
    if (resp.status === 201 || resp.status === 200) return null;
    if (resp.status === 422 && attempt < 2) continue;
    return 'GitHub ответил ошибкой ' + resp.status + '.';
  }
  return 'не удалось подобрать свободное имя файла.';
}

function ppResult(html, bad) {
  const box = document.getElementById('ppResult');
  box.className = 'pp-result show' + (bad ? ' pp-bad' : '');
  box.innerHTML = html;
}

function ppSelectedObjects() {
  return Array.prototype.slice
    .call(document.querySelectorAll('#ppObjBox .pp-obj:checked'))
    .map(el => el.value);
}

async function ppAdd() {
  const name = document.getElementById('ppName').value.trim();
  const position = document.getElementById('ppPosition').value.trim();
  const role = document.getElementById('ppRole').value;
  const objects = role === 'site_head' ? ppSelectedObjects() : [];
  if (!name) { ppResult('Без ФИО завести нельзя.', true); return; }
  if (role === 'site_head' && !objects.length) {
    ppResult('У начальника участка должен быть хотя бы один объект.', true);
    return;
  }
  // Совпадение по ФИО и уровню — предупреждение, а не отказ: однофамильцы на
  // стройке бывают, и решать это за Александра неправильно.
  const twin = ((PP_DATA && PP_DATA.people) || []).some(
    p => !p.revoked_at && p.name === name && p.role === role);

  const key = ppNewKey();
  const person = {name: name, position: position, role: role, objects: objects,
                  key: key, issued_at: new Date().toISOString().slice(0, 10)};
  const btn = document.getElementById('ppSave');
  btn.disabled = true; btn.textContent = 'Заводим…';
  const error = await ppSend({
    kind: 'people_add', v: 1,
    reporter_key: (WHO && WHO.key) || '',
    author: (WHO && WHO.name) || '',
    person: person,
  });
  btn.disabled = false; btn.textContent = 'Завести и показать ссылку';
  if (error) { ppResult('Не отправлено: ' + ppEsc(error), true); return; }

  PP_PENDING.push(person);
  ppRender();
  ppResult(
    (twin ? '<p><strong>Такой человек уже есть</strong> — с тем же ФИО и уровнем ' +
            'доступа. Заведён всё равно: если это ошибка, отзовите лишнего.</p>' : '') +
    '<p><strong>' + ppEsc(name) + '</strong> — ' + ppEsc(ppRoleLabel(role)) +
    '. Ссылка для передачи:</p>' +
    '<span class="pp-link" id="ppNewLink">' + ppEsc(ppLink(key)) + '</span>' +
    '<button type="button" class="pp-act" id="ppCopyNew">Скопировать</button>' +
    '<p class="pp-hint">Ссылка заработает через 5–10 минут — столько нужно, ' +
    'чтобы запись дошла до хранилища и сайт обновился.<br>' +
    'Закрыли страницу, не скопировав? Ничего страшного: через те же 5–10 минут ' +
    'этот человек появится в таблице выше, и ссылку можно будет взять оттуда.</p>');
  document.getElementById('ppCopyNew').addEventListener('click', function () {
    ppCopy(ppLink(key), this);
  });
  ['ppName', 'ppPosition'].forEach(id => { document.getElementById(id).value = ''; });
  document.querySelectorAll('#ppObjBox .pp-obj').forEach(el => { el.checked = false; });
}

async function ppRevoke(personId, name) {
  if (!window.confirm('Отозвать доступ: ' + name + '?\n\nЕго ссылка перестанет ' +
      'открывать формы, а закрытые разделы он больше не расшифрует.')) return;
  const error = await ppSend({
    kind: 'people_revoke', v: 1,
    reporter_key: (WHO && WHO.key) || '',
    author: (WHO && WHO.name) || '',
    person_id: personId,
  });
  ppResult(error ? 'Не отправлено: ' + ppEsc(error)
    : 'Доступ отзывается: <strong>' + ppEsc(name) + '</strong>. Через 5–10 минут ' +
      'его ссылка перестанет работать.', !!error);
}

async function ppUpdateObjects(personId, name, current) {
  const answer = window.prompt('Объекты для «' + name + '» через запятую.\n' +
    'Доступные: ' + PP_OBJECT_CODES.join(', '), (current || []).join(', '));
  if (answer === null) return;
  const objects = answer.split(',').map(s => s.trim()).filter(s => s);
  if (!objects.length) { ppResult('Нужен хотя бы один объект.', true); return; }
  const error = await ppSend({
    kind: 'people_update', v: 1,
    reporter_key: (WHO && WHO.key) || '',
    author: (WHO && WHO.name) || '',
    person_id: personId, objects: objects,
  });
  ppResult(error ? 'Не отправлено: ' + ppEsc(error)
    : 'Объекты для <strong>' + ppEsc(name) + '</strong> меняются: ' +
      ppEsc(objects.join(', ')) + '. Через 5–10 минут это будет на сайте.', !!error);
}

function ppWire() {
  document.getElementById('ppShowRevoked').addEventListener('change', ppRender);
  document.getElementById('ppAddBtn').addEventListener('click', () => {
    document.getElementById('ppForm').classList.toggle('show');
  });
  document.getElementById('ppCancel').addEventListener('click', () => {
    document.getElementById('ppForm').classList.remove('show');
  });
  document.getElementById('ppRole').addEventListener('change', e => {
    document.getElementById('ppObjBox').style.display =
      e.target.value === 'site_head' ? '' : 'none';
  });
  document.getElementById('ppSave').addEventListener('click', () => {
    ppAdd().catch(e => ppResult('Не получилось: ' + ppEsc(e && e.message), true));
  });
  document.getElementById('ppBody').addEventListener('click', e => {
    const btn = e.target.closest ? e.target.closest('button[data-act]') : null;
    if (!btn) return;
    const tr = btn.closest('tr');
    const name = tr.cells[0].textContent;
    const act = btn.dataset.act;
    if (act === 'show' || act === 'copy') {
      const span = tr.querySelector('.pp-link[data-link]');
      const link = span.dataset.link;
      if (act === 'show') span.textContent = link;
      else ppCopy(link, btn);
      return;
    }
    if (act === 'revoke') {
      ppRevoke(tr.dataset.id, name)
        .catch(err => ppResult('Не получилось: ' + ppEsc(err && err.message), true));
      return;
    }
    if (act === 'objects') {
      const person = ((PP_DATA && PP_DATA.people) || [])
        .filter(p => p.person_id === tr.dataset.id)[0];
      ppUpdateObjects(tr.dataset.id, name, person && person.objects)
        .catch(err => ppResult('Не получилось: ' + ppEsc(err && err.message), true));
    }
  });
}

// Раздел показывается, только если он расшифровался: не директору обёртка
// ключа не адресована, и содержимого у него нет вовсе.
async function ppSetup(section, who) {
  if (!authMayManagePeople(who)) return;
  PP_DATA = await secOpen(section, who && who.key);
  if (!PP_DATA) {
    // Уровень доступа директорский, а раздел не открылся: либо страница
    // собрана до того, как выдали доступ, либо браузер не умеет HKDF. Молча
    // не показывать раздел нельзя — Александр не поймёт, куда он делся.
    const box = document.getElementById('peopleBlock');
    box.classList.add('show');
    box.querySelector('#ppTable').hidden = true;
    box.querySelector('.pp-toolbar').hidden = true;
    box.querySelector('.pp-log').hidden = true;
    box.querySelector('.pp-note').textContent =
      'Этот раздел сейчас не открывается. Обновите страницу через 10 минут; ' +
      'если не поможет — напишите Артёму.';
    return;
  }
  document.getElementById('peopleBlock').classList.add('show');
  ppWire();
  ppRender();
}
// <<< people-core

function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

async function bootstrap() {
  const who = await authResolve(AUTH_ENTRIES);
  // Список объектов не отрисовывается вовсе, пока ключ не сошёлся: разметка
  // лежит в <template>, и в документ её кладёт только эта ветка.
  if (!who) { authShowDenied(); return; }
  WHO = who;
  const allowed = OBJECTS.filter(o => authAllows(who, o.code));
  if (!allowed.length) { authShowDenied(); return; }
  authMountPage();

  // «Все объекты» — про роль, а не про число строк: начальник участка, у
  // которого сейчас оба объекта, ведёт именно эти два, а не «все».
  const scope = authMayEditPlan(who)
    ? 'все объекты'
    : (allowed.length > 1 ? 'объекты ' : 'объект ') +
      allowed.map(o => o.code).join(', ');
  document.getElementById('whoami').textContent =
    (who.name || '') + (who.name ? ' — ' : '') + scope +
    (who.role ? ' (' + authRoleLabel(who.role) + ')' : '');

  document.getElementById('objList').innerHTML = allowed.map(o =>
    '<li><a href="' + esc(authLink(o.file, who)) + '">' +
    esc(o.name) + ' (' + esc(o.code) + ')</a></li>').join('');

  // Редактор плана — только офису и директору: начальнику участка ссылка на
  // него не показывается вовсе, а страница его всё равно не пустит.
  if (authMayEditPlan(who)) {
    document.getElementById('planBlock').hidden = false;
    document.getElementById('planList').innerHTML = allowed
      .filter(o => o.plan).map(o =>
        '<li><a href="' + esc(authLink(o.plan, who)) + '">' +
        esc(o.name) + ' (' + esc(o.code) + ')</a></li>').join('');
  }

  // Раздел «Сотрудники». Не директору он не расшифруется, поэтому проверка
  // роли здесь — про то, что показывать, а не про то, что охранять.
  if (PEOPLE_SECTION) await ppSetup(PEOPLE_SECTION, who);
}

bootstrap().catch(e => {
  authShowDenied();
  if (window.console) console.error(e);
});

})();
</script>
</body>
</html>
